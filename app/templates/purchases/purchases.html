{% extends "base.html" %}

{% block title %}Purchases - {{ super() }}{% endblock %}

{% block content %}

<div class="container-fluid">

<!-- existing template content... -->

<script>
document.addEventListener('DOMContentLoaded', function() {
    const modal = document.getElementById('newPurchaseModal');
    const productSearch = document.getElementById('product_search');
    const productResults = document.getElementById('product_results');
    const productOptions = Array.from(document.querySelectorAll('#product_search_options option'));
    const supplierSelect = document.getElementById('supplier_id');
    const itemsTableBody = document.querySelector('#itemsTable tbody');
    const totalAmountInput = document.getElementById('total_amount');
    const totalAmountDisplay = document.getElementById('total_amount_display');
    const itemsJsonInput = document.getElementById('items_json');
    let items = [];

    if (!productSearch || !productResults || !itemsTableBody || !totalAmountInput || !itemsJsonInput) {
        console.error('Required elements not found in the DOM');
        return;
    }

    function escapeHtml(text) {
        const map = {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#039;'
        };
        return String(text ?? '').replace(/[&<>"']/g, m => map[m]);
    }

    function addItemToPurchase(productId, productName, costPrice) {
        if (items.some(item => Number(item.product_id) === Number(productId))) {
            alert('Product already added.');
            return;
        }

        items.push({
            product_id: Number(productId),
            name: String(productName || ''),
            quantity: 1,
            cost_price: Number(costPrice || 0)
        });
        renderTable();
        productSearch.value = '';
        productResults.style.display = 'none';
        productResults.innerHTML = '';
    }

    function renderProductSuggestions() {
        const term = (productSearch.value || '').trim().toLowerCase();
        const filtered = productOptions.filter(option => {
            const name = (option.dataset.name || option.textContent || '').toLowerCase();
            const value = option.value || '';
            return !term || name.includes(term) || value.includes(term) || (option.dataset.barcode || '').toLowerCase().includes(term);
        }).slice(0, 12);

        productResults.innerHTML = '';

        if (!filtered.length) {
            const emptyRow = document.createElement('div');
            emptyRow.className = 'list-group-item text-muted';
            emptyRow.textContent = 'No products found';
            productResults.appendChild(emptyRow);
            productResults.style.display = 'block';
            return;
        }

        filtered.forEach(option => {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'list-group-item list-group-item-action';
            button.setAttribute('data-product-id', option.value);
            button.setAttribute('data-product-name', option.dataset.name || option.textContent || '');
            button.setAttribute('data-product-cost', option.dataset.cost || '0');

            const name = document.createElement('div');
            name.className = 'fw-semibold';
            name.textContent = option.dataset.name || option.textContent || '';

            const meta = document.createElement('small');
            meta.className = 'text-muted';
            meta.textContent = 'Cost: ' + Number(option.dataset.cost || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

            button.appendChild(name);
            button.appendChild(meta);
            button.addEventListener('click', function() {
                addItemToPurchase(option.value, option.dataset.name || option.textContent || '', option.dataset.cost || 0);
            });
            productResults.appendChild(button);
        });

        productResults.style.display = 'block';
    }

    productSearch.addEventListener('input', renderProductSuggestions);
    productSearch.addEventListener('focus', renderProductSuggestions);

    function updateSummary() {
        let totalAmount = 0;
        items.forEach(item => {
            totalAmount += Number(item.quantity || 0) * Number(item.cost_price || 0);
        });

        totalAmountInput.value = totalAmount.toFixed(2);
        if (totalAmountDisplay) totalAmountDisplay.value = totalAmount.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        itemsJsonInput.value = JSON.stringify(items.map(item => ({
            product_id: Number(item.product_id),
            name: item.name,
            quantity: Number(item.quantity || 0),
            cost_price: Number(item.cost_price || 0),
            batch_code: item.batch_code || null,
            expiry_date: item.expiry_date || null
        })));
    }

    function renderTable() {
        itemsTableBody.innerHTML = '';

        if (items.length === 0) {
            itemsTableBody.innerHTML = '<tr><td colspan="5" class="text-center">No items added yet</td></tr>';
            updateSummary();
            return;
        }

        items.forEach((item, index) => {
            const total = Number(item.quantity || 0) * Number(item.cost_price || 0);
            const row = `
                <tr>
                    <td>${escapeHtml(item.name)}</td>
                    <td>
                        <input type="number" class="form-control quantity" value="${Number(item.quantity || 0)}" data-index="${index}" min="1" step="0.001">
                    </td>
                    <td>
                        <input type="number" class="form-control cost_price" value="${Number(item.cost_price || 0).toFixed(2)}" data-index="${index}" min="0" step="0.01">
                    </td>
                    <td class="text-end" data-role="line-total">${total.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</td>
                    <td><button type="button" class="btn btn-sm btn-danger remove-item" data-index="${index}">&times;</button></td>
                </tr>
            `;
            itemsTableBody.insertAdjacentHTML('beforeend', row);
        });

        updateSummary();
    }

    itemsTableBody.addEventListener('input', function(e) {
        const target = e.target;
        if (!target.classList.contains('quantity') && !target.classList.contains('cost_price')) {
            return;
        }

        const index = Number(target.dataset.index);
        if (Number.isNaN(index) || index < 0 || index >= items.length) {
            return;
        }

        const row = target.closest('tr');
        if (!row) {
            return;
        }

        const quantityInput = row.querySelector('.quantity');
        const costInput = row.querySelector('.cost_price');
        const quantity = parseFloat(quantityInput.value) || 0;
        const costPrice = parseFloat(costInput.value) || 0;

        items[index].quantity = quantity;
        items[index].cost_price = costPrice;

        const total = quantity * costPrice;
        const totalCell = row.querySelector('[data-role="line-total"]');
        if (totalCell) {
            totalCell.textContent = total.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        updateSummary();
    });

    itemsTableBody.addEventListener('click', function(e) {
        const removeBtn = e.target.closest('.remove-item');
        if (!removeBtn) {
            return;
        }

        const index = Number(removeBtn.dataset.index);
        if (Number.isNaN(index) || index < 0 || index >= items.length) {
            return;
        }

        items.splice(index, 1);
        renderTable();
    });

    modal.addEventListener('hidden.bs.modal', function () {
        document.getElementById('purchaseForm').reset();
        items = [];
        renderTable();
    });

    document.getElementById('purchaseForm').addEventListener('submit', function(e) {
        updateSummary();
        if (!items.length || items.some(item => Number(item.quantity || 0) <= 0 || Number(item.cost_price || 0) < 0)) {
            e.preventDefault();
            alert('Add at least one product with a valid quantity and cost price.');
        }
    });

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('open_modal') === 'new_purchase') {
        const supplierId = urlParams.get('supplier_id');
        if (supplierId) {
            const supplierSelect = document.getElementById('supplier_id');
            supplierSelect.value = supplierId;
            supplierSelect.dispatchEvent(new Event('change'));
            const selectedSupplier = supplierSelect.options[supplierSelect.selectedIndex];
            if (selectedSupplier) {
                const supplierName = selectedSupplier.textContent.trim();
                document.getElementById('product_search').setAttribute('data-supplier-name', supplierName);
            }
        }
        new bootstrap.Modal(modal).show();
    }
});

                    <div class="card shadow mb-4">

{% block scripts %}
<script>
function viewPurchase(purchaseId) {
    fetch('/api/purchases/' + purchaseId)
        .then(response => response.json())
        .then(data => {
            document.getElementById('viewPurchaseId').textContent = data.id;
            document.getElementById('viewPurchaseDate').textContent = data.date || 'N/A';
            document.getElementById('viewInvoiceNumber').textContent = data.invoice_number || 'N/A';
            document.getElementById('viewSupplierName').textContent = data.supplier_name || 'N/A';
            document.getElementById('viewTotalAmount').textContent = parseFloat(data.total_amount || 0).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            document.getElementById('viewAmountPaid').textContent = parseFloat(data.amount_paid || 0).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            document.getElementById('viewStatus').textContent = data.status || 'N/A';
            
            const itemsBody = document.getElementById('viewItemsBody');
            itemsBody.innerHTML = '';
            if (data.items && data.items.length > 0) {
                data.items.forEach(item => {
                    const row = '<tr><td>' + item.product_name + '</td><td>' + item.quantity + '</td><td>' + parseFloat(item.cost_price).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + '</td><td>' + parseFloat(item.total_cost).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + '</td></tr>';
                    itemsBody.innerHTML += row;
                });
            } else {
                itemsBody.innerHTML = '<tr><td colspan="4" class="text-center">No items found</td></tr>';
            }
            
            new bootstrap.Modal(document.getElementById('viewPurchaseModal')).show();
        })
        .catch(error => {
            alert('Error loading purchase details: ' + error);
        });
}

document.addEventListener('DOMContentLoaded', function() {
    const modal = document.getElementById('newPurchaseModal');
    const productSearch = document.getElementById('product_search');
    const supplierSelect = document.getElementById('supplier_id');
    const itemsTableBody = document.querySelector('#itemsTable tbody');
    const totalAmountInput = document.getElementById('total_amount');
    const itemsJsonInput = document.getElementById('items_json');
    let items = [];

    if (!productSearch || !itemsTableBody || !totalAmountInput || !itemsJsonInput) {
        console.error('Required elements not found in the DOM');
        return;
    }

    const seenProductKeys = new Set();
    Array.from(productSearch.options).forEach(option => {
        if (!option.value) return;
        const productKey = `${(option.getAttribute('data-name') || option.textContent || '').trim().toLocaleLowerCase()}::${(option.getAttribute('data-barcode') || '').trim().toLocaleLowerCase()}`;
        if (seenProductKeys.has(productKey)) {
            option.remove();
        } else {
            seenProductKeys.add(productKey);
        }
    });

    function filterProductsForSupplier() {
        const supplierId = supplierSelect ? supplierSelect.value : '';
        Array.from(productSearch.options).forEach(option => {
            if (!option.value) return;
            const optionSupplierId = option.getAttribute('data-supplier-id') || '';
            option.hidden = Boolean(supplierId && optionSupplierId && optionSupplierId !== supplierId);
        });
    }

    if (supplierSelect) {
        supplierSelect.addEventListener('change', filterProductsForSupplier);
        filterProductsForSupplier();
    }

    productSearch.addEventListener('change', function() {
        const selectedOption = this.options[this.selectedIndex];
        
        if (!selectedOption || !selectedOption.value) {
            console.warn('No option selected or empty value');
            return;
        }

        const productId = selectedOption.value;
        const productName = selectedOption.getAttribute('data-name') || selectedOption.textContent;
        const costPrice = parseFloat(selectedOption.getAttribute('data-cost') || 0);

        console.log('Selected product:', { productId, productName, costPrice });

        if (items.some(item => item.product_id === productId)) {
            alert('Product already added.');
            return;
        }

        const item = { product_id: productId, name: productName, quantity: 1, cost_price: costPrice };
        items.push(item);
        console.log('Item added, total items:', items.length);
        renderTable();
        this.value = '';
    });

    function escapeHtml(text) {
        const map = {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#039;'
        };
        return text.replace(/[&<>"']/g, m => map[m]);
    }

    function renderTable() {
        itemsTableBody.innerHTML = '';
        let totalAmount = 0;

        if (items.length === 0) {
            itemsTableBody.innerHTML = '<tr><td colspan="5" class="text-center">No items added yet</td></tr>';
        } else {
            items.forEach((item, index) => {
                const total = item.quantity * item.cost_price;
                totalAmount += total;

                const row = '<tr><td>' + escapeHtml(item.name) + '</td><td><input type="number" class="form-control quantity" value="' + Number(item.quantity || 0) + '" data-index="' + index + '" min="0.001" step="0.001"></td><td><input type="number" step="0.01" min="0" class="form-control cost_price" value="' + Number(item.cost_price || 0).toFixed(2) + '" data-index="' + index + '"></td><td class="text-end">' + total.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + '</td><td><button type="button" class="btn btn-sm btn-danger remove-item" data-index="' + index + '">&times;</button></td></tr>';
                itemsTableBody.insertAdjacentHTML('beforeend', row);
            });
        }

        totalAmountInput.value = totalAmount.toFixed(2);
        const totalDisplay = document.getElementById('total_amount_display');
        if (totalDisplay) totalDisplay.value = totalAmount.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        itemsJsonInput.value = JSON.stringify(items.map(item => ({
            product_id: item.product_id,
            name: item.name,
            quantity: Number(item.quantity || 0),
            cost_price: Number(item.cost_price || 0),
            batch_code: item.batch_code || null,
            expiry_date: item.expiry_date || null
        })));
    }

    itemsTableBody.addEventListener('input', function(e) {
        if (e.target.classList.contains('quantity') || e.target.classList.contains('cost_price')) {
            const index = parseInt(e.target.dataset.index);
            if (index >= 0 && index < items.length) {
                const row = e.target.closest('tr');
                items[index].quantity = parseFloat(row.querySelector('.quantity').value.replace(/,/g, '')) || 0;
                items[index].cost_price = parseFloat(row.querySelector('.cost_price').value.replace(/,/g, '')) || 0;
                renderTable();
            }
        }
    });

    itemsTableBody.addEventListener('click', function(e) {
        if (e.target.classList.contains('remove-item')) {
            const index = parseInt(e.target.dataset.index);
            if (index >= 0 && index < items.length) {
                items.splice(index, 1);
                renderTable();
            }
        }
    });

    modal.addEventListener('hidden.bs.modal', function () {
        document.getElementById('purchaseForm').reset();
        items = [];
        renderTable();
    });

    document.getElementById('purchaseForm').addEventListener('submit', function(e) {
        renderTable();
        if (!items.length || items.some(item => item.quantity <= 0 || item.cost_price < 0)) {
            e.preventDefault();
            alert('Add at least one product with a valid quantity and cost price.');
        }
    });

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('open_modal') === 'new_purchase') {
        const supplierId = urlParams.get('supplier_id');
        if (supplierId) {
            const supplierSelect = document.getElementById('supplier_id');
            supplierSelect.value = supplierId;
            supplierSelect.dispatchEvent(new Event('change'));
            const selectedSupplier = supplierSelect.options[supplierSelect.selectedIndex];
            if (selectedSupplier) {
                const supplierName = selectedSupplier.textContent.trim();
                document.getElementById('product_search').setAttribute('data-supplier-name', supplierName);
            }
        }
        new bootstrap.Modal(modal).show();
    }
});

function editPurchase(purchaseId) {
    fetch('/api/purchases/' + purchaseId)
        .then(response => response.json())
        .then(data => {
            document.getElementById('editPurchaseId').value = data.id;
            document.getElementById('editTotalAmount').value = parseFloat(data.total_amount || 0).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            document.getElementById('editAmountPaid').value = parseFloat(data.amount_paid || 0).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            document.getElementById('editStatus').value = data.status || 'pending';
            
            const totalAmount = parseFloat(data.total_amount || 0);
            const amountPaid = parseFloat(data.amount_paid || 0);
            const balance = totalAmount - amountPaid;
            document.getElementById('editBalance').textContent = balance.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            
            new bootstrap.Modal(document.getElementById('editPurchaseModal')).show();
        })
        .catch(error => {
            alert('Error loading purchase details: ' + error);
        });
}

document.getElementById('editAmountPaid').addEventListener('input', function() {
    const totalAmount = parseFloat(document.getElementById('editTotalAmount').value) || 0;
    const amountPaid = parseFloat(this.value) || 0;
    const balance = totalAmount - amountPaid;
    document.getElementById('editBalance').textContent = balance.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
});

document.getElementById('editPurchaseForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const purchaseId = document.getElementById('editPurchaseId').value;
    const amountPaid = document.getElementById('editAmountPaid').value;
    const status = document.getElementById('editStatus').value;
    const csrfToken = document.querySelector('input[name="csrf_token"]').value;
    
    fetch('/api/purchases/' + purchaseId, {
        method: 'PUT',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': csrfToken
        },
        body: JSON.stringify({
            amount_paid: amountPaid,
            status: status
        })
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            alert('Purchase updated successfully!');
            bootstrap.Modal.getInstance(document.getElementById('editPurchaseModal')).hide();
            location.reload();
        } else {
            alert('Error: ' + data.message);
        }
    })
    .catch(error => {
        alert('Error updating purchase: ' + error);
    });
});

function showDeleteConfirmPasswordModal(type) {
    const html = `
    <div class="modal fade" id="deletePasswordModal" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title">CONFIRM DELETION</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="alert alert-danger mb-3">
                        <strong>Warning!</strong><br>
                        <small>Admin password verification required to delete this ${type}.</small>
                    </div>
                    <div class="form-group">
                        <label for="deletePassword" class="form-label">Admin Password:</label>
                        <div class="input-group">
                            <input type="password" id="deletePassword" class="form-control form-control-lg" 
                                   placeholder="Enter your password" autocomplete="off" 
                                   style="font-size: 1.1rem; letter-spacing: 0.2em;" />
                            <button class="btn btn-outline-secondary" type="button" id="toggleDeletePassword" tabindex="-1"
                                    title="Show/Hide password">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div id="deletePasswordError" class="alert alert-danger mt-2" style="display: none;\"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Confirm Delete</button>
                </div>
            </div>
        </div>
    </div>
    `;
    const ex = document.getElementById('deletePasswordModal');
    if (ex) ex.remove();
    document.body.insertAdjacentHTML('beforeend', html);
    
    const modalElement = document.getElementById('deletePasswordModal');
    const m = new bootstrap.Modal(modalElement);
    
    modalElement.addEventListener('shown.bs.modal', function() {
        const pwdInput = document.getElementById('deletePassword');
        const toggleBtn = document.getElementById('toggleDeletePassword');
        const confirmBtn = document.getElementById('confirmDeleteBtn');
        const errDiv = document.getElementById('deletePasswordError');
        
        if (pwdInput) {
            pwdInput.focus();
            pwdInput.select();
        }
        
        if (toggleBtn) {
            toggleBtn.addEventListener('click', function(e) {
                e.preventDefault();
                if (pwdInput) {
                    const isPassword = pwdInput.type === 'password';
                    pwdInput.type = isPassword ? 'text' : 'password';
                    toggleBtn.innerHTML = isPassword ? '<i class="fas fa-eye-slash"></i>' : '<i class="fas fa-eye"></i>';
                    pwdInput.focus();
                }
            });
        }
        
        if (confirmBtn) {
            confirmBtn.addEventListener('click', function() {
                const pwd = pwdInput.value;
                if (!pwd) {
                    errDiv.textContent = 'Please enter your password';
                    errDiv.style.display = 'block';
                    return;
                }
                
                confirmBtn.disabled = true;
                confirmBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying...';
                
                // Verify password at backend
                const csrfToken = document.querySelector('input[name=\"csrf_token\"]')?.value || 
                                 document.querySelector('meta[name=\"csrf-token\"]')?.content || '';
                
                fetch('/auth/verify-admin-password', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json', 'X-CSRFToken': csrfToken},
                    body: JSON.stringify({password: pwd})
                })
                .then(r => r.json())
                .then(d => {
                    if (d.success) {
                        window.verifiedDeletePassword = pwd;
                        m.hide();
                        setTimeout(() => {
                            document.getElementById('deletePasswordModal').remove();
                            proceedWithDelete(window.pendingDeleteData.id, window.pendingDeleteData.invoice);
                        }, 300);
                    } else {
                        errDiv.textContent = d.error || 'Invalid password';
                        errDiv.style.display = 'block';
                        confirmBtn.disabled = false;
                        confirmBtn.innerHTML = 'Confirm Delete';
                        pwdInput.value = '';
                        pwdInput.focus();
                    }
                })
                .catch(e => {
                    errDiv.textContent = 'Error: ' + e.message;
                    errDiv.style.display = 'block';
                    confirmBtn.disabled = false;
                    confirmBtn.innerHTML = 'Confirm Delete';
                });
            });
        }
        
        if (pwdInput) {
            pwdInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    confirmBtn.click();
                }
            });
        }
    }, { once: true });
    
    m.show();
}

function deletePurchase(purchaseId, invoiceNumber) {
    const confirmed = confirm(`Are you sure you want to delete Purchase #${invoiceNumber}? This will reverse all stock updates.`);
    if (!confirmed) return;
    
    window.pendingDeleteData = {id: purchaseId, invoice: invoiceNumber};
    showDeleteConfirmPasswordModal('purchase');
}

function proceedWithDelete(purchaseId, invoiceNumber) {
    // Get CSRF token - try multiple selectors
    let csrfToken = document.querySelector('input[name="csrf_token"]')?.value;
    if (!csrfToken) {
        csrfToken = document.querySelector('meta[name="csrf-token"]')?.content;
    }
    
    const adminPassword = window.verifiedDeletePassword;
    
    fetch('/api/purchases/' + purchaseId, {
        method: 'DELETE',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': csrfToken || ''
        },
        body: JSON.stringify({
            admin_password: adminPassword
        })
    })
    .then(response => {
        if (!response.ok) {
            return response.json().then(data => {
                throw new Error(data.message || `HTTP error! status: ${response.status}`);
            });
        }
        return response.json();
    })
    .then(data => {
        if (data.success) {
            alert(data.message);
            location.reload();
        } else {
            alert('Error: ' + (data.message || 'Unknown error'));
        }
    })
    .catch(error => {
        console.error('Delete error:', error);
        alert('Error deleting purchase: ' + error.message);
    });
}
</script>
{% endblock %}
